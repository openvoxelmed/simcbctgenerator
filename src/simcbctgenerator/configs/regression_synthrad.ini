[DEFAULT]

[PatientConfig]
plan_dir = .
ct_dir = .
cbct_dir = .
export_structures = bowel,
priority = 1,
cm_mask = bowel
image_modality = SYNRAD
#XVI

[RegistrationConfig]
# Path to elastix binary (inside Docker container)
elastix_binary_path = /usr/lib/elastix-install/bin/elastix

# Optional: Path to custom parameter map file
# If not specified, a default B-spline parameter map will be created
parameter_map_path = ParameterMap_deformable.txt

# Optional: Path to neural network model file (for Impact-based registration)
model_path = M730_2_Layers.pt

# Destination directory for models (relative to persistent_data_dir)
models_dest_dir = Models/TS

# Directory for persistent data (models, parameter maps)
persistent_data_dir = /Data

# Number of threads for elastix
threads = 24

# Visualization settings
save_visualizations = True
visualization_output_dir =

# CT value clipping and standardization
clip_min = -1024.0
clip_max = 276.0
standardize_mean = -370.00039267657144
standardize_std = 436.5998675471528

# Mask settings
use_fixed_mask = False
use_moving_mask = False
