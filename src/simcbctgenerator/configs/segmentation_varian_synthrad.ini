[DEFAULT]
method=standard

[PatientConfig]
plan_dir = DICOM_PLAN
ct_dir = CT_SET
cbct_dir = IMAGES
export_structures = bowel,rectum,bladder
priority = 1, 2, 3
cm_mask = bowel
image_modality = synrad

[MotionConfig]
motion_type = PELVIS
amplitude_breathing = 5
contour_name = bowel
frequency_breathing = 20
phase_offset_breathing = 0
phase_offset_heart = 0
#breaths per minute (12-20)
time_per_projection = 0.18
#seconds
uncertainty = 0.02
#seconds
# Range values for random sampling per patient
amplitude_min = 3
amplitude_max = 8
frequency_min = 12
frequency_max = 20
time_per_projection_min = 0.15
time_per_projection_max = 0.22

[PhysicsConfig]
# X-ray physics parameters
photon_flux = 4.16e6
spr = 1.3
mas = 1.3
kv = 120
saturation_factor = 1.2
bp_amplitude = 1.06
bp_std = 939.0
# Varian OBI uses a Ti flat filter (0.4 mm), not Al
filtration_material = Ti
filtration_mm = 0.4
# Execution parameters - don't change unless needed
threads = 8
max_block_index = 200

[GeometryConfig]
# CBCT geometry - Varian setup
source_origin_distance = 1000.
source_detector_distance = 1500.
detector_offset = -160.
# Detector specifications
detector_size_h = 297.984
detector_size_w = 397.312
detector_pixels_h = 768
detector_pixels_w = 1024
# Acquisition angles
start_angle = 0.0
end_angle = 360.0
angle_increments = 0.4

[ReconstructionVolumeConfig]
# Reconstruction volume specifications
recon_size = 512,88,512
recon_origin = -231.999,-86.499,-231.999
recon_spacing = 0.908,1.988,0.908
