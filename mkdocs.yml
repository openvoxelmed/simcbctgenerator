site_name: SimCBCTGenerator
site_description: Framework-focused documentation for simulated CBCT generation
site_author: OpenVoxelMed
repo_url: https://github.com/openvoxelmed/simcbctgenerator
repo_name: openvoxelmed/simcbctgenerator

theme:
    name: material
    palette:
        - scheme: default
          primary: blue grey
          accent: teal
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - scheme: slate
          primary: blue grey
          accent: teal
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.copy

nav:
    - Home: index.md
    - Getting Started: getting-started.md
    - Examples: examples.md
    - API:
          - Overview: api-reference.md
          - Pipelines: api/pipelines.md
          - Advanced Configuration: api/advanced-configuration.md
          - Patient: api/patient.md

markdown_extensions:
    - admonition
    - codehilite:
          guess_lang: false
    - toc:
          permalink: true
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.details

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  paths: [src]
                  options:
                      docstring_style: google
                      show_source: true
                      show_root_heading: true
                      show_root_toc_entry: true
